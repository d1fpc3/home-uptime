name: uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      simulate_down:
        description: 'Open a test alert (the next normal run closes it)'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: uptime
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the home backends
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_DOWN: ${{ inputs.simulate_down }}
        run: ./check.sh
      - name: Save state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state.txt
          git diff --cached --quiet || { git commit -m "uptime: $(cut -d' ' -f1 state.txt)"; git push; }
